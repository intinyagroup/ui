name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'packages/docs/**'
      - 'packages/tokens/**'
      - 'packages/core/**'
      - 'packages/md3/**'
      - 'packages/flat/**'
      - 'packages/calendar/**'
      - 'packages/charts/**'
      - 'packages/data-table/**'
      - 'packages/grid-core/**'
      - 'packages/kanban/**'
      - 'packages/notion-database/**'
      - 'packages/storybook/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy docs to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache Turborepo
        uses: actions/cache@v6
        with:
          path: |
            .turbo
            packages/*/.turbo
            node_modules/.cache/turbo
          key: turbo-docs-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-docs-${{ runner.os }}-${{ github.ref_name }}-
            turbo-docs-${{ runner.os }}-

      - name: Build docs
        run: pnpm turbo run build --filter=@intinyagroup/docs

      - name: Deploy to Cloudflare Pages
        run: |
          pnpm dlx wrangler pages deploy packages/docs/build \
            --project-name=intinya-docs \
            --branch=main \
            --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}


      - name: Build storybook
        run: pnpm turbo run build --filter=@intinyagroup/storybook

      - name: Deploy storybook to Cloudflare Pages
        run: |
          pnpm dlx wrangler pages deploy packages/storybook/storybook-static \
            --project-name=intinya-storybook \
            --branch=main \
            --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}