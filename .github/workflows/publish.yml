name: Publish

on:
  workflow_dispatch:
    inputs:
      release-type:
        description: 'Release type'
        required: true
        default: 'alpha'
        type: choice
        options: [alpha, beta, stable]
      version:
        description: 'Version bump for stable (patch/minor/major); ignored for alpha/beta'
        required: true
        default: 'patch'
        type: choice
        options: [patch, minor, major]

jobs:
  publish:
    name: Publish all packages to npm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bump versions
        run: |
          node -e "
            const fs = require('fs');
            const stage = '${{ github.event.inputs.release-type }}';
            const bump = '${{ github.event.inputs.version }}';
            for (const f of fs.readdirSync('packages').map(d => 'packages/' + d + '/package.json')) {
              if (!fs.existsSync(f)) continue;
              const j = JSON.parse(fs.readFileSync(f, 'utf8'));
              if (j.private) continue;
              let [base, suffix] = (j.version || '0.0.0').split('-');
              const v = base.split('.').map(Number);
              if (stage === 'stable') {
                // Drop prerelease suffix, bump the requested segment.
                if (bump === 'minor') v[1]++;
                else if (bump === 'major') v[0]++;
                else if (!suffix) v[2]++; // already stable: patch
                j.version = v.join('.');
              } else {
                // Prerelease stage: bump what's there.
                const m = suffix ? suffix.match(/^(alpha|beta|rc)\.(\d+)(.*)$/) : null;
                if (m && m[1] === stage) {
                  // Same stage: increment counter (alpha.15 -> alpha.16)
                  j.version = base + '-' + stage + '.' + (Number(m[2]) + 1);
                } else if (m) {
                  // Different stage: reset to .0 (alpha.15 -> beta.0)
                  j.version = base + '-' + stage + '.0';
                } else {
                  // Stable -> prerelease: bump patch and start stage
                  if (bump === 'minor') v[1]++;
                  else if (bump === 'major') v[0]++;
                  else v[2]++;
                  j.version = v.join('.') + '-' + stage + '.0';
                }
              }
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + '\n');
            }
          "
          echo "--- Bumped versions ---"
          grep -h '"version"' packages/*/package.json | sort | uniq -c

      - name: Commit bumped versions
        run: |
          git config user.name "intinya-bot"
          git config user.email "bot@intinya.dev"
          git add packages/*/package.json pnpm-lock.yaml
          git commit -m "chore: bump to \$${{ github.event.inputs.release-type }} (pre-publish)" || echo "nothing to commit"
          git push origin main

      - name: Build all packages
        run: pnpm -r run build

      - name: Rewrite workspace:* deps to versions
        run: ./scripts/stage-publish.sh --rewrite-only

      - name: Publish all packages in dependency order
        run: |
          set -euo pipefail
          # Dependency-first order: tokens, ui deps, then leaf packages
          ORDER=(tokens grid-core core md3 flat cli editor-core native rich-text motion \
                 motion-captions motion-effects motion-media motion-player motion-studio \
                 motion-three book-writer calendar charts collaboration kanban pdf-viewer \
                 slides spreadsheet data-table image-editor)
          STAGE='${{ github.event.inputs.release-type }}'
          TAG="$STAGE"
          [ "$STAGE" = "stable" ] && TAG="latest"
          for pkg in "${ORDER[@]}"; do
            if [ -d "packages/$pkg" ]; then
              echo "--- Publishing @intinyagroup/$pkg @ $TAG ---"
              (cd packages/$pkg && npm publish --tag "$TAG")
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify published versions
        run: |
          STAGE='${{ github.event.inputs.release-type }}'
          TAG="$STAGE"
          [ "$STAGE" = "stable" ] && TAG="latest"
          for pkg in tokens grid-core core md3 flat cli editor-core native rich-text motion data-table; do
            v=$(npm view @intinyagroup/$pkg@$TAG version 2>/dev/null | tail -1)
            echo "@intinyagroup/$pkg@$TAG: $v"
          done

      - name: Tag release
        id: tag
        run: |
          VERSION=$(node -p "require('./packages/tokens/package.json').version")
          echo "Release version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          git config user.name "intinya-bot"
          git config user.email "bot@intinya.dev"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.tag.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ github.event.inputs.release-type != 'stable' }}
          name: v${{ steps.tag.outputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Summarize
        run: |
          echo "## Packages published (${{ github.event.inputs.release-type }})" >> $GITHUB_STEP_SUMMARY
          echo "Triggered by: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY