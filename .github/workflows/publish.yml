name: Publish

on:
  workflow_dispatch:
    inputs:
      release-type:
        description: "Release type"
        required: true
        default: "alpha"
        type: choice
        options: [alpha, beta, stable, prepared]
      version:
        description: "Version bump for stable (patch/minor/major); ignored for alpha/beta/prepared"
        required: true
        default: "patch"
        type: choice
        options: [patch, minor, major]
      package:
        description: 'Specific package to publish (leave "all" for all packages)'
        required: false
        default: "all"
jobs:
  publish:
    name: Publish all packages to npm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate prepared versions
        if: ${{ github.event.inputs.release-type == 'prepared' }}
        run: |
          node -e "
            const fs = require('fs');
            const pending = fs.readdirSync('.changeset').filter((f) => f.endsWith('.md') && f !== 'README.md');
            if (pending.length) throw new Error('Prepared release has unprocessed changesets: ' + pending.join(', '));
          "

      - name: Bump versions
        if: ${{ github.event.inputs.release-type != 'prepared' }}
        run: |
          node -e "
            const fs = require('fs');
            const stage = '${{ github.event.inputs.release-type }}';
            const bump = '${{ github.event.inputs.version }}';
          for (const d of fs.readdirSync('packages')) {
            const targetPkg = '${{ github.event.inputs.package }}';
            const matched = targetPkg === 'all' || targetPkg === '' || targetPkg === d || (targetPkg === 'ui' && d === 'core');
            if (!matched) continue;
            const f = 'packages/' + d + '/package.json';
            if (!fs.existsSync(f)) continue;
            const j = JSON.parse(fs.readFileSync(f, 'utf8'));
            if (j.private) continue;
            let [base, suffix] = (j.version || '0.0.0').split('-');
              const v = base.split('.').map(Number);
              if (stage === 'stable') {
                // Drop prerelease suffix, bump the requested segment.
                if (bump === 'minor') {
                  v[1]++;
                  v[2] = 0;
                } else if (bump === 'major') {
                  v[0]++;
                  v[1] = 0;
                  v[2] = 0;
                } else if (!suffix) {
                  v[2]++; // already stable: patch
                }
                j.version = v.join('.');
              } else {
                // Prerelease stage: bump what's there.
                const m = suffix ? suffix.match(/^(alpha|beta|rc)\.(\d+)(.*)$/) : null;
                if (m && m[1] === stage) {
                  // Same stage: increment counter (alpha.15 -> alpha.16)
                  j.version = base + '-' + stage + '.' + (Number(m[2]) + 1);
                } else if (m) {
                  // Different stage: reset to .0 (alpha.15 -> beta.0)
                  j.version = base + '-' + stage + '.0';
                } else {
                  // Stable -> prerelease: bump patch and start stage
                  if (bump === 'minor') v[1]++;
                  else if (bump === 'major') v[0]++;
                  else v[2]++;
                  j.version = v.join('.') + '-' + stage + '.0';
                }
              }
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + '\n');
            }
          "
          echo "--- Bumped versions ---"
          grep -h '"version"' packages/*/package.json | sort | uniq -c

      - name: Commit bumped versions
        if: ${{ github.event.inputs.release-type != 'prepared' }}
        run: |
          git config user.name "intinya-bot"
          git config user.email "bot@intinya.dev"
          git add packages/*/package.json pnpm-lock.yaml
          git commit -m "chore: bump to \$${{ github.event.inputs.release-type }} (pre-publish)" || echo "nothing to commit"
          git push origin main

      - name: Build all packages
        run: pnpm -r run build

      - name: Rewrite workspace:* deps to versions
        run: ./scripts/stage-publish.sh --rewrite-only
      - name: Publish all packages in dependency order
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > .npmrc
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > ~/.npmrc
          npm whoami
          ORDER=(tokens grid-core core md3 flat cli editor-core native rich-text motion \
                 motion-captions motion-effects motion-media motion-player motion-studio \
                 motion-three book-writer calendar charts collaboration kanban pdf-viewer \
                 slides spreadsheet data-table image-editor react react-data-table notion-database)
          STAGE='${{ github.event.inputs.release-type }}'
          TAG="$STAGE"
          [ "$STAGE" = "stable" ] && TAG="latest"
          [ "$STAGE" = "prepared" ] && TAG="latest"
          TARGET_PKG='${{ github.event.inputs.package }}'
          for pkg in "${ORDER[@]}"; do
            if [ "$TARGET_PKG" != "all" ] && [ "$TARGET_PKG" != "" ]; then
              if [ "$TARGET_PKG" != "$pkg" ] && ! [ "$TARGET_PKG" = "ui" -a "$pkg" = "core" ]; then
                continue
              fi
            fi
            if [ -d "packages/$pkg" ]; then
              (
                cd "packages/$pkg"
                pkg_name=$(node -p "require('./package.json').name")
                pkg_ver=$(node -p "require('./package.json').version")
                if npm view "$pkg_name@$pkg_ver" version >/dev/null 2>&1; then
                  echo "⏩ $pkg_name@$pkg_ver is already published, skipping."
                  exit 0
                fi
                published=false
                for attempt in 1 2 3 4; do
                  if npm publish --tag "$TAG" --access public; then
                    published=true
                    break
                  fi
                  if [ "$attempt" -lt 4 ]; then
                    echo "Publish failed for $pkg (attempt $attempt), waiting 20s before retry..."
                    sleep 20
                  fi
                done
                if [ "$published" != true ]; then
                  echo "Publish failed permanently for $pkg after 4 attempts" >&2
                  exit 1
                fi
              )
              sleep 6
            fi
          done
      - name: Verify published versions
        run: |
          STAGE='${{ github.event.inputs.release-type }}'
          TAG="$STAGE"
          [ "$STAGE" = "stable" ] && TAG="latest"
          for pkg in tokens grid-core core md3 flat cli editor-core native rich-text motion data-table; do
            v=$(npm view @intinyagroup/$pkg@$TAG version 2>/dev/null | tail -1)
            echo "@intinyagroup/$pkg@$TAG: $v"
          done

      - name: Tag release
        id: tag
        run: |
          VERSION=$(node -p "require('./packages/core/package.json').version")
          echo "Release version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          git config user.name "intinya-bot"
          git config user.email "bot@intinya.dev"
          git tag -fa "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION" --force || echo "Tag already pushed or remote updated"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.tag.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ github.event.inputs.release-type != 'stable' && github.event.inputs.release-type != 'prepared' }}
          name: v${{ steps.tag.outputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Summarize
        run: |
          echo "## Packages published (${{ github.event.inputs.release-type }})" >> $GITHUB_STEP_SUMMARY
          echo "Triggered by: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
