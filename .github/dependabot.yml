version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
    groups:
      svelte:
        patterns:
          - "svelte*"
          - "@sveltejs/*"
      storybook:
        patterns:
          - "@storybook/*"
          - "storybook"
      tanstack:
        patterns:
          - "@tanstack/*"
      tip:
        patterns:
          - "@tiptap/*"
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci(deps)"
